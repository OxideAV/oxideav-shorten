name: Fuzz

# Daily fuzz run for the cargo-fuzz harness under fuzz/. Shorten is a
# single bit-level command stream behind a byte-aligned header, with
# no external library oracle (the clean-room wall bars every third-party
# Shorten implementation), so the harness is internal-contract only:
# panic-free parse/decode, the whole-stream vs streaming differential,
# the structure-aware encode→decode round trip, the SHNAMPSK trailer
# boundary rules, and packet-chunked trait-wrapper agreement. The
# shared budget is split across the five targets by the org workflow.

on:
  schedule:
    - cron: "47 5 * * *"   # daily 05:47 UTC, jittered off the hour
  workflow_dispatch:

jobs:
  fuzz:
    uses: OxideAV/.github/.github/workflows/crate-fuzz.yml@master
    with:
      time_budget_seconds: 1800
    secrets: inherit
